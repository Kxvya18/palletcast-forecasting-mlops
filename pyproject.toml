[project]
name = "palletcast-forecasting-mlops"
version = "0.1.0"
description = "End-to-end MLOps: outbound pallet volume forecasting for a cold-storage operator (simulated data)"
requires-python = ">=3.11,<3.13"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.2",
    "pyarrow>=15",
    "pandera>=0.20",
    "holidays>=0.50",
    "pyyaml>=6",
    "lightgbm>=4.7.0",
    "catboost>=1.2.10",
    "mlflow>=3.17.0",
    "fastapi>=0.143.0",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.5",
    "dvc>=3.50",
    "matplotlib>=3.8",
    "statsmodels>=0.14",
    "jupyter>=1.0",
    "nbconvert>=7",
    "httpx>=0.28.1",
]
train = [
    "evidently>=0.7.23",
    "neuralforecast>=3.3.0",
    "prefect>=3.8.8",
    "prophet>=1.5.0",
    "scikit-learn>=1.9.1",
    "statsforecast>=2.0.1",
    "xgboost>=3.2.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/palletcast"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
"notebooks/*" = ["E501", "E702", "B905", "E402", "B023"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.uv]
default-groups = ["dev", "train"]   # local work installs everything; Docker uses core only
