# Simulation config for outbound shipments.
# Every number here is an assumption; see docs/s1_data.md for the rationale.

seed: 20261011
start_date: "2023-01-01"
end_date: "2026-09-30"        # last ship date simulated
history_cutoff: "2026-01-01"  # rows ingested before this form the history snapshot;
                              # later rows arrive as monthly live batches (by ingestion time)

truck_capacity_pallets: 33    # EU full truckload
full_truck_share: 0.75        # share of shipments that leave as full loads

# Outbound capacity is a hard daily limit (crane/dock throughput). Demand above it
# becomes backlog shipped on the next working day.
sites:
  # weekly: relative outbound volume Mon..Sun (0 = site does not ship that day)
  - {site_id: S01, country: NL, capacity_pallets_per_day: 2400, n_customers: 10,
     weekly: [1.15, 1.00, 1.00, 1.00, 0.95, 0.30, 0.00]}
  - {site_id: S02, country: GB, capacity_pallets_per_day: 3600, n_customers: 9,
     weekly: [1.10, 1.00, 1.00, 1.05, 1.00, 0.40, 0.10]}
  - {site_id: S03, country: DE, capacity_pallets_per_day: 3200, n_customers: 11,
     weekly: [1.15, 1.00, 1.00, 1.00, 1.00, 0.25, 0.00]}   # Sunday HGV ban
  - {site_id: S04, country: ES, capacity_pallets_per_day: 2200, n_customers: 9,
     weekly: [1.10, 1.00, 1.00, 1.00, 0.95, 0.20, 0.00]}

customers:
  base_median_pallets_per_day: 110   # lognormal median of a customer's base volume
  base_sigma: 0.6
  base_clip: [20, 500]
  growth_mean: 0.05                  # annual organic growth per customer
  growth_sd: 0.05
  frozen_share: 0.9                  # rest are chilled
  ar_phi: 0.6                        # AR(1) persistence of log-demand shocks
  ar_sigma: 0.10
  negbin_dispersion: 20              # var = mu + mu^2 / r
  segment_weights: {fries_potato: 0.25, ice_cream: 0.2, ready_meals: 0.2,
                    frozen_veg: 0.15, bakery: 0.1, seafood: 0.1}

# Annual profile per segment: sum of Gaussian bumps on day-of-year
# [center_doy, width_days, amplitude]; normalised to mean 1 over the year.
segments:
  fries_potato: [[300, 40, 0.15], [30, 30, 0.10], [200, 30, -0.15]]
  ice_cream:    [[165, 45, 1.20]]
  ready_meals:  [[345, 15, 0.50], [30, 40, 0.15], [200, 40, -0.15]]
  frozen_veg:   [[270, 50, 0.20]]
  bakery:       [[340, 20, 0.60], [95, 10, 0.25]]
  seafood:      [[350, 12, 0.70], [75, 20, 0.20]]
ice_cream_year_sd: 0.15   # summer amplitude varies by year (weather; unobserved)
segment_amp_jitter: 0.2   # per-customer amplitude multiplier ~ U(1-j, 1+j)

calendar:
  year_end_lull: {start_md: "12-27", end_md: "12-31", factor: 0.6}
  holiday_shift_prev: 0.6   # share of a closed holiday's volume pre-built on earlier working days
  holiday_prev_weights: [0.5, 0.3, 0.2]   # spread over the 3 working days before
  holiday_shift_next: 0.3   # share caught up on later working days; the rest is lost
  holiday_next_weights: [0.6, 0.4]        # spread over the 2 working days after

promotions:
  per_customer_per_year: 6
  duration_days: [7, 21]
  uplift: {price_cut: [1.5, 2.0], multibuy: [1.3, 1.6], display: [1.15, 1.35]}
  ship_lead_days: [5, 10]   # retailer DCs are stocked ahead of the in-store promo
  post_dip: 0.85            # after the shipping window, for half the duration
  announce_lead_days: [28, 56]
  unannounced_share: 0.10   # promos that never appear in the promo calendar

# Known business events. These drive the drift that S7/S8 must handle.
events:
  onboard:
    - {site_id: S01, segment: frozen_veg, base: 180, date: "2024-05-06", ramp_days: 56}
    - {site_id: S03, segment: ready_meals, base: 220, date: "2025-02-03", ramp_days: 56}
    - {site_id: S02, segment: ice_cream, base: 350, date: "2026-03-02", ramp_days: 42}   # live period
  churn:
    - {site_id: S04, customer_rank: 2, date: "2025-06-02", ramp_days: 28}
  weekly_change:
    - {site_id: S02, date: "2026-04-04", weekday: 5, new_factor: 0.85}   # Saturday shift added
  unannounced_level_shift:
    - {site_id: S04, customer_rank: 0, date: "2026-06-01", factor: 0.65}  # lost a retail contract

order_lead_days: [1, 5]
ingestion:
  late_share: 0.03          # rows ingested 2-10 days after shipping
  late_days: [2, 10]

faults:
  exact_duplicate_rate: 0.002
  correction_rate: 0.003         # wrong pallets first, corrected row arrives 1-7 days later
  non_positive_pallets_rate: 0.0005
  unknown_customer_rate: 0.0005
  site_customer_mismatch_rate: 0.0003
  order_after_ship_rate: 0.0003
  null_key_rate: 0.0002
  outages_per_site_year: 0.75    # whole days whose shipments never reach the feed
  outage_days: [1, 3]
  partial_outages_per_site_year: 0.75   # site-days where only part of the feed arrives
  partial_keep_share: [0.10, 0.45]      # designed detection range (see docs/s1_data.md)

validation:
  max_quarantine_rate: 0.01      # batch hard-fails above this
  # Volume check: site-day total / median of the same weekday over the previous N weeks.
  # Targets data errors (partial feed loss), not demand swings. Thresholds are calibrated on
  # seeds other than the project seed: src/palletcast/data/calibrate_volume_check.py,
  # results in reports/calibration/volume_check.json and docs/s1_data.md section 5.
  outlier_window_weeks: 8
  outlier_low_ratio: 0.5
  outlier_high_ratio: 3.0
  outlier_high_ratio_near_holiday: 10.0
  outlier_min_gap_share: 0.05    # |gap| must be >= this share of a typical Tue-Thu day
  max_late_share: 0.06
  staleness_days: 2
